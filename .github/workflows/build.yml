name: Build RK Mirror APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rk-mirror-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Profile ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [1, 2, 3]

    steps:
      - name: Checkout cloud kit
        uses: actions/checkout@v7

      - name: Free safe runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell || true
          df -h

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go 1.25.10
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.10'
          cache: false

      - name: Verify Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then SDK_ROOT="$candidate"; break; fi
            done
          fi
          test -n "$SDK_ROOT"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          NDK='27.0.12077973'
          SDKMANAGER=''
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -111 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ ! -d "$SDK_ROOT/platforms/android-36" ] || [ ! -d "$SDK_ROOT/build-tools/36.0.0" ] || [ ! -d "$SDK_ROOT/ndk/$NDK" ]; then
            test -n "$SDKMANAGER"
            set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true; set -o pipefail
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' "ndk;$NDK"
          fi
          test -d "$SDK_ROOT/platforms/android-36"
          test -d "$SDK_ROOT/build-tools/36.0.0"
          test -d "$SDK_ROOT/ndk/$NDK"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK" >> "$GITHUB_ENV"
          java -version
          go version
          df -h

      - name: Clone exact upstream v0.0.33
        shell: bash
        run: |
          set -euxo pipefail
          git clone --branch v0.0.33 --depth 1 --recurse-submodules https://github.com/jqssun/android-display-mirror.git src
          test "$(git -C src rev-parse HEAD)" = '6836ad7efe3e27b8db76422fdbc9b81b4973c16a'
          test "$(git -C src/doubletake/doubletake rev-parse HEAD)" = '568a06ed32afa9fafdf229a798db0786f4d020f2'

      - name: Generate API-matched RK-X40 patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile generate_rkx40.py apply_patch.py tools/manual_prepare.py
          python3 apply_patch.py --repo src --profile '${{ matrix.profile }}'
          test -s src/doubletake/rkx40.go
          grep -n -m 3 'SetupMirrorRKX40' src/doubletake/rkx40.go
          grep -n -m 3 'SetupMirrorRKX40' src/doubletake/airplaylib/airplaylib.go
          grep -n -m 3 'rkx40.go' src/build.sh
          gofmt -d src/doubletake/rkx40.go

      - name: Build AirPlay AAR with automatic fallback
        shell: bash
        run: |
          set -u
          PROFILE='${{ matrix.profile }}'
          KIT="$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/src"
          rm -f "../airplay-upstream-P${PROFILE}.log" "../airplay-fallback-P${PROFILE}.log"

          echo '=== Attempt 1: exact upstream build.sh ==='
          set +e
          bash -x ./build.sh 2>&1 | tee "../airplay-upstream-P${PROFILE}.log"
          RC=${PIPESTATUS[0]}
          set -e

          if [ "$RC" -ne 0 ] || [ ! -s app/libs/airplaylib.aar ]; then
            echo "Upstream AirPlay builder exited $RC; switching automatically to deterministic fallback."
            rm -f app/libs/airplaylib.aar
            git -C doubletake/doubletake reset --hard '568a06ed32afa9fafdf229a798db0786f4d020f2'
            git -C doubletake/doubletake clean -fdx
            set +e
            bash "$KIT/tools/manual_build_airplay.sh" "$GITHUB_WORKSPACE/src" "$KIT" "$PROFILE" 2>&1 | tee "../airplay-fallback-P${PROFILE}.log"
            RC2=${PIPESTATUS[0]}
            set -e
            if [ "$RC2" -ne 0 ]; then
              echo "Manual AirPlay fallback also failed (exit $RC2)."
              exit "$RC2"
            fi
          fi
          test -s app/libs/airplaylib.aar
          ls -lh app/libs/airplaylib.aar

      - name: Build Android APK
        working-directory: src
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon assembleDebug --stacktrace
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          OUT="../RK-Mirror-X40-P${{ matrix.profile }}-debug.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          ls -lh "$OUT" "$OUT.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: RK-Mirror-X40-P${{ matrix.profile }}
          path: |
            RK-Mirror-X40-P${{ matrix.profile }}-debug.apk
            RK-Mirror-X40-P${{ matrix.profile }}-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics if anything fails
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-P${{ matrix.profile }}
          path: |
            airplay-upstream-P${{ matrix.profile }}.log
            airplay-fallback-P${{ matrix.profile }}.log
            src/build.sh
            src/doubletake/rkx40.go
            src/doubletake/airplaylib/airplaylib.go
            src/doubletake/doubletake/internal/airplay/rkx40.go
            src/doubletake/doubletake/internal/airplay/mirror.go
            src/doubletake/doubletake/internal/airplay/client.go
            src/doubletake/doubletake/go.mod
            src/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
