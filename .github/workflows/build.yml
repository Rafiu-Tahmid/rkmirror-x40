name: Build RK Mirror APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Profile ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [1, 2, 3]

    steps:
      - name: Checkout this kit
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          df -h

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false

      - name: Install Android SDK pieces
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.0.12077973'
          test -d "$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Clone exact upstream release
        shell: bash
        run: |
          set -euxo pipefail
          git clone --branch v0.0.33 --depth 1 --recurse-submodules \
            https://github.com/jqssun/android-display-mirror.git src
          cd src
          test "$(git rev-parse HEAD)" = "6836ad7efe3e27b8db76422fdbc9b81b4973c16a"
          git submodule status --recursive

      - name: Apply RK-X40 compatibility profile
        shell: bash
        run: |
          set -euxo pipefail
          python3 apply_patch.py --repo src --profile '${{ matrix.profile }}'
          grep -R "SetupMirrorRKX40" -n src/doubletake | head
          grep -R "RKX40" -n src/doubletake/airplaylib/airplaylib.go | head

      - name: Build AirPlay library
        working-directory: src
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build.sh gradlew
          ./build.sh
          test -s app/libs/airplaylib.aar

      - name: Build Android APK
        working-directory: src
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "../RK-Mirror-X40-P${{ matrix.profile }}-debug.apk"
          sha256sum "../RK-Mirror-X40-P${{ matrix.profile }}-debug.apk" > "../RK-Mirror-X40-P${{ matrix.profile }}-debug.apk.sha256"

      - name: Upload APK + checksum
        uses: actions/upload-artifact@v4
        with:
          name: RK-Mirror-X40-P${{ matrix.profile }}
          path: |
            RK-Mirror-X40-P${{ matrix.profile }}-debug.apk
            RK-Mirror-X40-P${{ matrix.profile }}-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-P${{ matrix.profile }}
          path: |
            src/app/build/reports/**
            src/app/build/outputs/logs/**
            src/.gradle/**/fileHashes/**
          if-no-files-found: ignore
          retention-days: 7
